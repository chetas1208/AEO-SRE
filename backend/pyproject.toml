[project]
name = "aeo-sre-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30", "alembic>=1.13", "psycopg[binary]>=3.2", "asyncpg>=0.29",
  "redis>=5.0", "arq>=0.26", "httpx>=0.27", "beautifulsoup4>=4.12", "trafilatura>=1.12",
  "networkx>=3.3", "numpy>=1.26", "scikit-learn>=1.5", "structlog>=24.1",
  "sse-starlette>=2.1", "python-dotenv>=1.0",
  "neo4j>=5.26",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
]
[project.optional-dependencies]
ml = ["lightgbm>=4.3", "sentence-transformers>=3.0", "datasets>=2.20", "joblib>=1.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5", "mypy>=1.10", "aiosqlite>=0.20"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B904", "E501"]
[tool.setuptools.packages.find]
include = ["app*", "ml*"]
